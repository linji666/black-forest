<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070a">
<title>黑森林</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070a;
font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
color:#dfe7ea;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
justify-content:center;text-align:center;padding:26px;z-index:20;background:#05070a;}
.screen.on{display:flex;}
h1{font-size:26px;font-weight:400;letter-spacing:13px;margin:0 0 12px;color:#c9d4d8;}
h2{font-size:10px;font-weight:300;letter-spacing:7px;margin:0 0 30px;color:#55636b;}
p{font-size:13px;line-height:2.1;color:#8b9aa2;margin:0 0 10px;max-width:540px;}
p.q{color:#5f6d75;font-size:11.5px;}
.btn{margin-top:24px;padding:13px 40px;font-size:13px;letter-spacing:4px;color:#9fd8d8;
border:1px solid #38505c;background:rgba(18,30,38,.8);border-radius:2px;cursor:pointer;}
.btn:active{background:rgba(34,56,68,.95);}
#cutImg{display:none;max-width:min(52vw,430px);max-height:38vh;margin:0 0 18px;
border:1px solid #22333b;border-radius:2px;}
#hud{position:absolute;top:0;left:0;right:0;padding:12px 18px;display:flex;
justify-content:space-between;font-size:11.5px;letter-spacing:2px;color:#7d8d95;z-index:10;
pointer-events:none;text-shadow:0 0 10px #000;}
#toast{position:absolute;left:0;right:0;bottom:14%;text-align:center;font-size:14px;
letter-spacing:2px;color:#cfd8dc;text-shadow:0 0 12px #000,0 0 34px #000;z-index:10;
pointer-events:none;opacity:0;transition:opacity .55s;}
#toast.on{opacity:1;}
#flash{position:absolute;inset:0;background:#000;z-index:15;pointer-events:none;
opacity:0;transition:opacity .55s;}
#ver{position:absolute;left:14px;bottom:8px;font-size:10px;letter-spacing:2px;
color:#2f4149;z-index:11;pointer-events:none;}
#sCut p{max-width:min(62vw,620px);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="hudL"></span><span id="hudR"></span></div>
<div id="toast"></div>
<div id="flash"></div>
<div id="ver">v4</div>

<div class="screen on" id="sTitle">
<h1>黑森林</h1>
<h2>DON'T LOOK BACK</h2>
<p>传说这片林子里住着吃人的东西。<br>你和朋友还是来了 —— 露营、采蘑菇、捡柴。</p>
<p class="q">手机：按住屏幕任意处拖动　·　电脑：WASD 或方向键<br>建议横屏</p>
<div class="btn" id="bStart">进 林 子</div>
</div>

<div class="screen" id="sCut">
<h1 id="cutT" style="font-size:19px;letter-spacing:7px;"></h1>
<img id="cutImg" alt="">
<p id="cutB"></p>
<div class="btn" id="bCut">继 续</div>
</div>

<div class="screen" id="sEnd">
<h1 id="endT" style="font-size:20px;letter-spacing:7px;"></h1>
<img id="endImg" alt="" style="display:none;max-width:min(52vw,430px);max-height:34vh;margin:0 0 20px;border:1px solid #22333b;border-radius:2px;">
<p id="endB"></p>
<div class="btn" id="bAgain">再 来 一 次</div>
</div>

<script src="game.js?v=5"></script>
</body>
</html>
