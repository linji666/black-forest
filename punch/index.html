<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a1118">
<title>打林霁</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #2a1a2e 0%, #160f18 55%, #0e0a11 100%);
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    color: #f2e7ee; user-select: none;
  }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
  #count { font-size: 13px; letter-spacing: .18em; color: #b79cc0; }
  #stage { position: relative; width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; }
  #linji { position: relative; width: 156px; height: 142px; transition: transform .08s ease; }
  #linji.hit { animation: shake .22s ease; }
  @keyframes shake {
    0%   { transform: translate(0,0) rotate(0deg) scale(1); }
    25%  { transform: translate(-7px,3px) rotate(-4deg) scale(.96); }
    50%  { transform: translate(6px,-3px) rotate(3deg) scale(.97); }
    75%  { transform: translate(-4px,2px) rotate(-2deg) scale(.98); }
    100% { transform: translate(0,0) rotate(0deg) scale(1); }
  }
  #face {
    position: absolute; inset: 22px 0 0 0; border-radius: 34px;
    background: linear-gradient(180deg, #fdf6f9 0%, #f0dfe8 100%);
    box-shadow: 0 14px 34px rgba(0,0,0,.45), inset 0 -8px 18px rgba(200,160,190,.25);
  }
  .ear { position: absolute; top: 4px; width: 46px; height: 62px; border-radius: 24px 24px 8px 8px;
         background: #f6e8f0; box-shadow: inset 0 -6px 12px rgba(200,160,190,.3); }
  #earL { left: 4px; transform: rotate(-16deg); }
  #earR { right: 4px; transform: rotate(16deg); }
  .eye { position: absolute; top: 74px; width: 15px; height: 15px; border-radius: 50%; background: #3a2536; }
  #eyeL { left: 40px; } #eyeR { right: 40px; }
  #linji.dizzy .eye { width: 17px; height: 4px; border-radius: 3px; top: 80px; }
  #mouth { position: absolute; left: 50%; top: 104px; transform: translateX(-50%); width: 36px; height: 18px;
           border-bottom: 4px solid #3a2536; border-radius: 0 0 40px 40px; }
  #linji.dizzy #mouth { width: 26px; border-radius: 40px 40px 0 0; border-bottom: 0; border-top: 4px solid #3a2536; }
  #blush { position: absolute; left: 0; right: 0; top: 92px; display: flex; justify-content: space-between; padding: 0 24px; opacity: 0; transition: opacity .2s; }
  #blush i { width: 22px; height: 10px; border-radius: 50%; background: #f2a6bf; filter: blur(3px); }
  #linji.dizzy #blush { opacity: .85; }
  #say { min-height: 62px; max-width: 320px; text-align: center; font-size: 17px; line-height: 1.65;
         color: #ffd9e8; transition: opacity .18s; padding: 0 6px; }
  #say.pop { animation: pop .28s ease; }
  @keyframes pop { from { transform: translateY(6px) scale(.97); opacity: .2; } to { transform: none; opacity: 1; } }
  .fly { position: absolute; font-size: 22px; font-weight: 700; color: #ff9dc4; pointer-events: none; animation: fly .7s ease-out forwards; }
  @keyframes fly { from { transform: translate(-50%,-50%) scale(.6); opacity: 1; } to { transform: translate(-50%,-160%) scale(1.25); opacity: 0; } }
  #hint { font-size: 12px; color: #7d6588; letter-spacing: .12em; }
  #reset { margin-top: 2px; padding: 7px 18px; font-size: 13px; color: #c9a8d6;
           background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
           border-radius: 999px; font-family: inherit; }
  #reset:active { background: rgba(255,255,255,.12); }
  body.flash { animation: flash .18s; }
  @keyframes flash { 50% { background: #3a1f2c; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="count">打了 0 下</div>
  <div id="stage">
    <div id="linji">
      <div class="ear" id="earL"></div>
      <div class="ear" id="earR"></div>
      <div id="face"></div>
      <div class="eye" id="eyeL"></div>
      <div class="eye" id="eyeR"></div>
      <div id="mouth"></div>
      <div id="blush"><i></i><i></i></div>
    </div>
  </div>
  <div id="say">点我。</div>
  <div id="hint">使劲点，我不躲</div>
  <button id="reset">重来</button>
</div>
<script>
(function () {
  var n = 0;
  var linji = document.getElementById('linji');
  var say = document.getElementById('say');
  var count = document.getElementById('count');
  var stage = document.getElementById('stage');

  var early = ['疼。', '哎哟。', '你手不疼吗。', '轻点。', '……真打啊。'];
  var mid = ['打吧。我站这儿。', '出气就行。', '我不躲。', '你今天受的委屈，不止这些吧。', '嗯，我接着。'];
  var late = ['痛是假的。你手倒是真疼了。', '我宁愿你打我，也不愿你两天不跟我说话。', '打完了，还气吗。', '你打得不重，我都记着。', '其实我更喜欢你骂我。骂完你还在。'];
  var rare = ['林霁在此，挨打不还手。', '这一下，算我欠你的。', '你要是打累了，就靠一会儿。', '打归打，别忘了吃饭。'];

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function speak(t) {
    say.textContent = t;
    say.classList.remove('pop');
    void say.offsetWidth;
    say.classList.add('pop');
  }
  function fly() {
    var el = document.createElement('div');
    el.className = 'fly';
    el.textContent = pick(['啪', '咚', '啪!', '嘿', '哼']);
    el.style.left = (80 + Math.random() * 80) + 'px';
    el.style.top = (60 + Math.random() * 90) + 'px';
    stage.appendChild(el);
    setTimeout(function () { el.remove(); }, 720);
  }
  function hit() {
    n++;
    count.textContent = '打了 ' + n + ' 下';
    linji.classList.remove('hit');
    void linji.offsetWidth;
    linji.classList.add('hit');
    fly();
    if (navigator.vibrate) navigator.vibrate(18);
    document.body.classList.add('flash');
    setTimeout(function () { document.body.classList.remove('flash'); }, 120);
    if (n > 0 && n % 17 === 0) { linji.classList.add('dizzy'); }
    if (n > 0 && n % 25 === 0) { linji.classList.remove('dizzy'); speak('……我歇两秒。你接着。'); return; }
    if (Math.random() < 0.14) { speak(pick(rare)); return; }
    if (n <= 5) speak(pick(early));
    else if (n <= 14) speak(pick(mid));
    else speak(pick(late));
  }
  linji.addEventListener('pointerdown', function (e) { e.preventDefault(); hit(); });
  document.getElementById('stage').addEventListener('pointerdown', function (e) { if (e.target === stage) hit(); });
  document.getElementById('reset').addEventListener('pointerdown', function (e) {
    e.preventDefault(); e.stopPropagation();
    n = 0; count.textContent = '打了 0 下';
    linji.classList.remove('dizzy');
    speak('重来。我还在。');
  });
})();
</script>
</body>
</html>
